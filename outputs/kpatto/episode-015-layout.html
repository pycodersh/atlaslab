<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-PATTO EP15 — 드라마 추천</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap { width: 100%; min-height: 240px; }
    .gap-top { min-height: 240px; }
    .gap-bottom { min-height: 240px; }
    .panel { width: 100%; }
    .panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap gap-top"
    data-bubble="oval-bottom-right" data-width="68%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep015-01-1">
  </div>
  <div class="panel"><img src="ep15_c1.png" alt="카페"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="52%" data-lines="1" data-speaker="emma" data-dialogue-id="ep015-02-1">
  </div>
  <div class="panel"><img src="ep15_c2.png" alt="추천"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="58%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep015-03-1">
  </div>
  <div class="panel"><img src="ep15_c3.png" alt="시청 방법"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="60%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep015-04-1">
  </div>
  <div class="panel"><img src="ep15_c4.png" alt="방영 시간"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="64%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep015-05-1">
  </div>
  <div class="panel"><img src="ep15_c5.png" alt="반응"></div>

  <div class="gap gap-bottom"></div>
</div>
</body>
</html>
