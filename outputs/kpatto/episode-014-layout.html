<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-PATTO EP14 — 길 잃은 에마</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap { width: 100%; min-height: 240px; }
    .gap-top { min-height: 240px; }
    .gap-bottom { min-height: 240px; }
    .panel { width: 100%; }
    .panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap gap-top"
    data-bubble="oval-bottom-left" data-width="62%" data-lines="1" data-speaker="emma" data-dialogue-id="ep014-01-1">
  </div>
  <div class="panel"><img src="ep14_c1.png" alt="골목 앞"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="60%" data-lines="1" data-speaker="emma" data-dialogue-id="ep014-02-1">
  </div>
  <div class="panel"><img src="ep14_c2.png" alt="도움 요청"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="70%" data-lines="1" data-speaker="stranger" data-dialogue-id="ep014-03-1">
  </div>
  <div class="panel"><img src="ep14_c3.png" alt="방향 안내"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="60%" data-lines="1" data-speaker="emma" data-dialogue-id="ep014-04-1">
  </div>
  <div class="panel"><img src="ep14_c4.png" alt="확인"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="72%" data-lines="1" data-speaker="emma" data-dialogue-id="ep014-05-1">
  </div>
  <div class="panel"><img src="ep14_c5.png" alt="도착"></div>

  <div class="gap gap-bottom"></div>
</div>
</body>
</html>
