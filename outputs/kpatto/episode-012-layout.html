<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-PATTO EP12 — 식당에서 (심화)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap { width: 100%; min-height: 240px; }
    .gap-top { min-height: 240px; }
    .gap-bottom { min-height: 240px; }
    .panel { width: 100%; }
    .panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap gap-top"
    data-bubble="oval-bottom-right" data-width="70%" data-lines="1" data-speaker="minjun" data-dialogue-id="ep012-01-1">
  </div>
  <div class="panel"><img src="ep12_c1.png" alt="식당 입구"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="62%" data-lines="1" data-speaker="emma" data-dialogue-id="ep012-02-1">
  </div>
  <div class="panel"><img src="ep12_c2.png" alt="주문"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="66%" data-lines="1" data-speaker="emma" data-dialogue-id="ep012-03-1">
  </div>
  <div class="panel"><img src="ep12_c3.png" alt="식사 중"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="64%" data-lines="1" data-speaker="emma" data-dialogue-id="ep012-04-1">
  </div>
  <div class="panel"><img src="ep12_c4.png" alt="반찬"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="58%" data-lines="1" data-speaker="emma" data-dialogue-id="ep012-05-1">
  </div>
  <div class="panel"><img src="ep12_c5.png" alt="식사 후"></div>

  <div class="gap gap-bottom"></div>
</div>
</body>
</html>
