<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-PATTO EP20 — 오랜만에 만남</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap { width: 100%; min-height: 240px; }
    .gap-top { min-height: 240px; }
    .gap-bottom { min-height: 240px; }
    .panel { width: 100%; }
    .panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap gap-top"
    data-bubble="oval-bottom-left" data-width="54%" data-lines="1" data-speaker="emma" data-dialogue-id="ep020-01-1">
  </div>
  <div class="panel"><img src="ep20_c1.png" alt="카페 앞"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="52%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep020-02-1">
  </div>
  <div class="panel"><img src="ep20_c2.png" alt="안부"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="50%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep020-03-1">
  </div>
  <div class="panel"><img src="ep20_c3.png" alt="근황"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="54%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep020-04-1">
  </div>
  <div class="panel"><img src="ep20_c4.png" alt="대화"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="52%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep020-05-1">
  </div>
  <div class="panel"><img src="ep20_c5.png" alt="헤어짐"></div>

  <div class="gap gap-bottom"></div>
</div>
</body>
</html>
