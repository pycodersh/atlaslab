<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-PATTO EP11 — 지하철에서</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap { width: 100%; min-height: 240px; }
    .gap-top { min-height: 240px; }
    .gap-bottom { min-height: 240px; }
    .panel { width: 100%; }
    .panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap gap-top"
    data-bubble="oval-bottom-right" data-width="58%" data-lines="1" data-speaker="jisu" data-dialogue-id="ep011-01-1">
  </div>
  <div class="panel"><img src="ep11_c1.png" alt="지하철역 입구"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="48%" data-lines="1" data-speaker="emma" data-dialogue-id="ep011-02-1">
  </div>
  <div class="panel"><img src="ep11_c2.png" alt="노선도 앞"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="52%" data-lines="1" data-speaker="emma" data-dialogue-id="ep011-03-1">
  </div>
  <div class="panel"><img src="ep11_c3.png" alt="지하철 안"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="48%" data-lines="1" data-speaker="jisu" data-dialogue-id="ep011-04-1">
  </div>
  <div class="panel"><img src="ep11_c4.png" alt="홍대입구역 하차"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="64%" data-lines="1" data-speaker="emma" data-dialogue-id="ep011-05-1">
  </div>
  <div class="panel"><img src="ep11_c5.png" alt="택시 앞"></div>

  <div class="gap gap-bottom"></div>
</div>
</body>
</html>
