<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-PATTO EP16 — 날씨 이야기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap { width: 100%; min-height: 240px; }
    .gap-top { min-height: 240px; }
    .gap-bottom { min-height: 240px; }
    .panel { width: 100%; }
    .panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap gap-top"
    data-bubble="oval-bottom-right" data-width="68%" data-lines="1" data-speaker="jisu" data-dialogue-id="ep016-01-1">
  </div>
  <div class="panel"><img src="ep16_c1.png" alt="아침"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="62%" data-lines="1" data-speaker="emma" data-dialogue-id="ep016-02-1">
  </div>
  <div class="panel"><img src="ep16_c2.png" alt="날씨 예보"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="66%" data-lines="1" data-speaker="emma" data-dialogue-id="ep016-03-1">
  </div>
  <div class="panel"><img src="ep16_c3.png" alt="점심"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="54%" data-lines="1" data-speaker="jisu" data-dialogue-id="ep016-04-1">
  </div>
  <div class="panel"><img src="ep16_c4.png" alt="오후"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="62%" data-lines="1" data-speaker="emma" data-dialogue-id="ep016-05-1">
  </div>
  <div class="panel"><img src="ep16_c5.png" alt="저녁"></div>

  <div class="gap gap-bottom"></div>
</div>
</body>
</html>
