<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-PATTO EP19 — 경복궁 여행</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap { width: 100%; min-height: 240px; }
    .gap-top { min-height: 240px; }
    .gap-bottom { min-height: 240px; }
    .panel { width: 100%; }
    .panel img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap gap-top"
    data-bubble="oval-bottom-right" data-width="60%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep019-01-1">
  </div>
  <div class="panel"><img src="ep19_c1.png" alt="경복궁 입구"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="54%" data-lines="1" data-speaker="emma" data-dialogue-id="ep019-02-1">
  </div>
  <div class="panel"><img src="ep19_c2.png" alt="사진"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="60%" data-lines="1" data-speaker="emma" data-dialogue-id="ep019-03-1">
  </div>
  <div class="panel"><img src="ep19_c3.png" alt="기념품 가게"></div>

  <div class="gap"
    data-bubble="oval-bottom-right" data-width="56%" data-lines="1" data-speaker="sophie" data-dialogue-id="ep019-04-1">
  </div>
  <div class="panel"><img src="ep19_c4.png" alt="마무리"></div>

  <div class="gap"
    data-bubble="oval-bottom-left" data-width="62%" data-lines="1" data-speaker="emma" data-dialogue-id="ep019-05-1">
  </div>
  <div class="panel"><img src="ep19_c5.png" alt="SNS"></div>

  <div class="gap gap-bottom"></div>
</div>
</body>
</html>
