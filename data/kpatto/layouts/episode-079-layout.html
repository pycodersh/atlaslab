<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>K-PATTO EP79</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f0eb; display: flex; justify-content: center; }
    .episode { width: 100%; max-width: 430px; display: flex; flex-direction: column; }
    .gap-top    { min-height: 100px; }
    .gap-xl     { min-height: 200px; }
    .gap-lg     { min-height: 160px; }
    .gap-bottom { min-height: 100px; }
    .panel img  { width: 100%; height: auto; display: block; }
    .panel-split { width: 100%; display: flex; align-items: flex-start; }
    .panel-split img { width: 100%; height: auto; display: block; }
    .stack { display: flex; flex-direction: column; }
  </style>
</head>
<body>
<div class="episode">
  <div class="gap-top"></div>

  <!-- 가로2 컷 (중첩) -->
  <div class="panel-split">
    <img src="ep79_c1.png" alt="컷1" style="width: 49.8%;">
    <div class="stack" style="width: 50.2%;">
      <img src="ep79_c2.png" alt="컷2">
      <img src="ep79_c3.png" alt="컷3">
    </div>
  </div>
  <div class="gap-xl"></div>

  <!-- 세로 컷 -->
  <div class="panel"><img src="ep79_c4.png" alt="컷4"></div>
  <div class="gap-lg"></div>

  <!-- 가로2 컷 -->
  <div class="panel-split">
    <img src="ep79_c5.png" alt="컷5" style="width: 49.71%;">
    <img src="ep79_c6.png" alt="컷6" style="width: 50.29%;">
  </div>

  <div class="gap-bottom"></div>
</div>
</body>
</html>
