<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표현 음성 확인 — 의문문 끝 억양</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#272c36; --fg:#e8eaf0; --dim:#9aa3b2; --accent:#7dd3fc; --new:#4ade80; --old:#f59e0b; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --card:#fff; --line:#e3e6ec; --fg:#151821; --dim:#606a7b; --accent:#0369a1; --new:#15803d; --old:#b45309; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 20px 60px; background:var(--bg); color:var(--fg);
         font-family:"Pretendard",-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:var(--dim); font-size:13px; line-height:1.7; margin-bottom:24px; }
  .sub code { background:var(--card); padding:1px 5px; border-radius:4px; border:1px solid var(--line); }
  .expr { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
  .expr h2 { font-size:16px; margin:0 0 2px; }
  .expr .meta { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:660px; }
  td, th { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  th { color:var(--dim); font-weight:600; font-size:12px; white-space:nowrap; }
  .txt { font-size:14px; }
  .q { color:var(--accent); font-weight:600; }
  audio { width:200px; height:32px; vertical-align:middle; }
  .dur { color:var(--dim); font-size:11px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); }
  .tag.new { color:var(--new); } .tag.old { color:var(--old); }
  .err { color:#f87171; font-size:13px; }
</style>
</head>
<body>

<h1>표현 음성 확인 — 의문문 끝이 올라가는지</h1>
<div class="sub">
  <b>새 음성</b> = OpenAI <code>gpt-4o-mini-tts</code> / <code>sage</code> — Supabase 라이브 URL, 캐시 우회 <code>?v=</code> 적용<br>
  <b>기존</b> = Gemini <code>Zephyr</code>, 덮어쓰기 직전 백업본(로컬)<br>
  <span class="q">파란 글씨</span>가 물음표로 끝나는 문장입니다 — 끝 억양이 올라가는지 들어보세요.
</div>

<div id="root">불러오는 중…</div>

<script>
const BUST = Date.now();

function player(src) {
  return '<audio controls preload="metadata" src="' + src + '"></audio><span class="dur" data-for="' + src + '"></span>';
}

fetch('expr-data.json?v=' + BUST)
  .then(r => r.json())
  .then(data => {
    document.getElementById('root').innerHTML = data.map(e => {
      const rows = e.parts.map(p => {
        const isQ = /[?？]\s*$/.test(p.text);
        return '<tr>' +
          '<td>' + p.key + '</td>' +
          '<td class="txt' + (isQ ? ' q' : '') + '">' + p.text + '</td>' +
          '<td>' + player(p.liveUrl + '?v=' + BUST) + '</td>' +
          '<td>' + (p.backup ? player(p.backup) : '<span class="dim">없음</span>') + '</td>' +
        '</tr>';
      }).join('');
      return '<div class="expr">' +
        '<h2>' + e.korean + ' <span style="color:var(--dim);font-weight:400;font-size:13px">' + e.english + '</span></h2>' +
        '<div class="meta">slug: ' + e.slug + ' · id=' + e.id + '</div>' +
        '<div class="wrap"><table><thead><tr><th>파트</th><th>텍스트</th>' +
        '<th><span class="tag new">새 음성</span> gpt-4o-mini-tts / sage</th>' +
        '<th><span class="tag old">기존</span> Gemini Zephyr</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</div>';
    }).join('');

    document.querySelectorAll('audio').forEach(a => {
      a.addEventListener('loadedmetadata', () => {
        const tag = document.querySelector('.dur[data-for="' + a.getAttribute('src') + '"]');
        if (tag && isFinite(a.duration)) tag.textContent = a.duration.toFixed(2) + 's';
      });
      a.addEventListener('play', () => {
        document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); });
      });
    });
  })
  .catch(err => {
    document.getElementById('root').innerHTML =
      '<div class="err">expr-data.json을 불러오지 못했습니다: ' + err + '<br>scripts/_build_expr_listen_page.ts 를 먼저 실행하세요.</div>';
  });
</script>
</body>
</html>
