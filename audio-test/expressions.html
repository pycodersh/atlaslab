<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>표현 음성 확인 — 의문문 끝 억양</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#272c36; --fg:#e8eaf0; --dim:#9aa3b2; --accent:#7dd3fc; --new:#4ade80; --mid:#f59e0b; --old:#a78bfa; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --card:#fff; --line:#e3e6ec; --fg:#151821; --dim:#606a7b; --accent:#0369a1; --new:#15803d; --mid:#b45309; --old:#6d28d9; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 20px 60px; background:var(--bg); color:var(--fg);
         font-family:"Pretendard",-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:var(--dim); font-size:13px; line-height:1.7; margin-bottom:22px; }
  .sub code { background:var(--card); padding:1px 5px; border-radius:4px; border:1px solid var(--line); }
  .expr { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
  .expr h2 { font-size:16px; margin:0 0 2px; }
  .expr .meta { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:820px; }
  td, th { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr.patternrow { background:rgba(125,211,252,.07); }
  th { color:var(--dim); font-weight:600; font-size:12px; white-space:nowrap; }
  .txt { font-size:14px; white-space:nowrap; }
  .q { color:var(--accent); font-weight:600; }
  audio { width:190px; height:32px; vertical-align:middle; }
  .dur { color:var(--dim); font-size:11px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .none { color:var(--dim); font-size:12px; font-style:italic; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); }
  .tag.new { color:var(--new); } .tag.mid { color:var(--mid); } .tag.pre { color:var(--dim); } .tag.old { color:var(--old); }
  .err { color:#f87171; font-size:13px; }
</style>
</head>
<body>

<h1>표현 음성 확인 — 의문문 끝 억양</h1>
<div class="sub">
  <b class="q">파란 배경 줄이 pattern</b>입니다 — 이번에 억양만 다시 만든 대상. 예문 3줄은 건드리지 않았습니다.<br>
  · <span class="tag new">현재 ?유지</span> instructions에 의문 억양 지시 + <b>TTS 입력에 물음표 유지</b> (Supabase 라이브, 캐시 우회)<br>
  · <span class="tag mid">?제거</span> 같은 지시, 입력에서 <b>물음표를 뗀</b> 버전<br>
  · <span class="tag pre">지시없음</span> 의문 억양 지시가 <b>없던</b> 최초 OpenAI 버전<br>
  · <span class="tag old">Zephyr</span> 최초 Gemini 버전 (참고용)<br>
  전부 <code>gpt-4o-mini-tts</code>/<code>sage</code>이며 Zephyr만 Gemini입니다.
</div>

<div id="root">불러오는 중…</div>

<script>
const BUST = Date.now();

function player(src) {
  if (!src) return '<span class="none">없음</span>';
  return '<audio controls preload="metadata" src="' + src + '"></audio><span class="dur" data-for="' + src + '"></span>';
}

fetch('expr-data.json?v=' + BUST)
  .then(r => r.json())
  .then(data => {
    document.getElementById('root').innerHTML = data.map(e => {
      const rows = e.parts.map(p => {
        const isPattern = p.key === 'pattern';
        const isQ = p.isQuestion;
        return '<tr' + (isPattern ? ' class="patternrow"' : '') + '>' +
          '<td>' + p.key + (isPattern ? ' ★' : '') + '</td>' +
          '<td class="txt' + (isQ ? ' q' : '') + '">' + p.text + '</td>' +
          '<td>' + player(p.liveUrl ? p.liveUrl + '?v=' + BUST : null) + '</td>' +
          '<td>' + player(p.noq) + '</td>' +
          '<td>' + player(p.preq) + '</td>' +
          '<td>' + player(p.zephyr) + '</td>' +
        '</tr>';
      }).join('');
      return '<div class="expr">' +
        '<h2>' + e.korean + ' <span style="color:var(--dim);font-weight:400;font-size:13px">' + e.english + '</span></h2>' +
        '<div class="meta">slug: ' + e.slug + ' · id=' + e.id + '</div>' +
        '<div class="wrap"><table><thead><tr>' +
        '<th>파트</th><th>텍스트</th>' +
        '<th><span class="tag new">현재</span> 지시 + ?유지</th>' +
        '<th><span class="tag mid">이전</span> 지시 + ?제거</th>' +
        '<th><span class="tag pre">그전</span> 지시 없음</th>' +
        '<th><span class="tag old">Zephyr</span> 최초</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</div>';
    }).join('');

    document.querySelectorAll('audio').forEach(a => {
      a.addEventListener('loadedmetadata', () => {
        const tag = document.querySelector('.dur[data-for="' + a.getAttribute('src') + '"]');
        if (tag && isFinite(a.duration)) tag.textContent = a.duration.toFixed(2) + 's';
      });
      a.addEventListener('play', () => {
        document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); });
      });
    });
  })
  .catch(err => {
    document.getElementById('root').innerHTML =
      '<div class="err">expr-data.json을 불러오지 못했습니다: ' + err + '<br>scripts/_build_expr_listen_page.ts 를 먼저 실행하세요.</div>';
  });
</script>
</body>
</html>
